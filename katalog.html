<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Katalog Tema Velora</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%236B5560%27/%3E%3Ctext x=%2732%27 y=%2742%27 font-size=%2728%27 text-anchor=%27middle%27 fill=%27%23fff%27 font-family=%27serif%27%3EVL%3C/text%3E%3C/svg%3E"><meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#6B5560;--rose:#A9706A;--bg:#F7F2EC;--card:#fff;--line:#E4DACB;--txt:#4A3C42;--mut:#7d6f74}
@media(prefers-color-scheme:dark){:root{--bg:#1E1A1C;--card:#2A2427;--line:#44393F;--txt:#EDE3E6;--ink:#E7D7DC;--mut:#b9aab0}}
*{box-sizing:border-box}body{margin:0;font-family:Poppins,sans-serif;background:var(--bg);color:var(--txt)}
header{padding:28px 20px 10px;text-align:center}h1{margin:0;color:var(--ink);font-weight:600;font-size:28px}header p{color:var(--mut);margin:6px 0 0;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px 16px}.chips button{font:inherit;font-size:13px;cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--txt);padding:8px 16px;border-radius:999px}.chips button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chips b{font-weight:600;margin-left:4px;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;padding:10px 20px 40px;max-width:1180px;margin:0 auto}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.c .sh{aspect-ratio:390/700;overflow:hidden;background:var(--line)}.c .sh img{width:100%;height:auto;display:block}
.c .in{padding:12px 14px 14px}.c b{display:block;color:var(--ink)}.c small{color:var(--mut);font-size:12px}.c .pr{margin:6px 0 10px;font-size:13px}
.c .bt{display:flex;gap:8px}.c a{flex:1;text-align:center;font-size:12px;padding:8px;border-radius:999px;text-decoration:none;border:1px solid var(--rose);color:var(--rose)}.c a.p{background:var(--rose);color:#fff}
.c .dt{background:none;border:0;padding:0;margin:0 0 8px;color:var(--rose);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer;text-align:left}
dialog{border:0;border-radius:16px;padding:0;max-width:520px;width:calc(100% - 32px);max-height:88vh;color:var(--txt);background:var(--card);font-family:Poppins,sans-serif}dialog::backdrop{background:rgba(20,20,20,.55)}
dialog .hd{display:flex;gap:14px;padding:18px 18px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}dialog .hd img{width:74px;border-radius:8px}dialog h3{margin:0;color:var(--ink);font-size:22px}dialog .hd small{color:var(--mut)}
dialog .bd{padding:14px 18px 18px;font-size:13.5px;line-height:1.6}dialog h4{margin:14px 0 6px;color:var(--ink);font-size:14px}dialog ul{list-style:none;margin:0;padding:0}dialog li{display:flex;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line)}dialog li i{font-style:normal;width:18px;flex:none;text-align:center}dialog li.no{color:var(--mut)}dialog li em{margin-left:auto;font-style:normal;font-size:11px;white-space:nowrap}
dialog .x{position:absolute;right:12px;top:10px;background:none;border:0;font-size:22px;cursor:pointer;color:var(--ink)}
</style></head><body>
<header><h1>Katalog Tema Velora</h1><p>Semua tema tersedia versi Pakai Foto dan Tanpa Foto.</p></header>
<div class="chips" id="kol"></div>
<div class="grid" id="g"></div><dialog id="dlg" aria-label="Detail tema"></dialog>
<script>
'use strict';
var HARGA={Standar:[99000,79000],Premium:[149000,129000],Signature:[199000,179000]},T=[],k='Semua';
function fmt(n){return 'Rp'+n.toLocaleString('id-ID')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function draw(){
  var ks=['Semua'];T.forEach(function(t){if(ks.indexOf(t.koleksi)<0)ks.push(t.koleksi)});
  document.getElementById('kol').innerHTML=ks.map(function(x){var n=x==='Semua'?T.length:T.filter(function(t){return t.koleksi===x}).length;return '<button class="'+(x===k?'on':'')+'" data-k="'+esc(x)+'">'+esc(x)+'<b>'+n+'</b></button>'}).join('');
  document.getElementById('g').innerHTML=T.filter(function(t){return k==='Semua'||t.koleksi===k}).map(function(t){var h=HARGA[t.tier];
    return '<div class="c"><div class="sh"><img loading="lazy" src="katalog/'+t.id+'/sampul.jpg" alt="Contoh tema '+esc(t.nama)+'" width="390" height="844"></div><div class="in"><b>'+esc(t.nama)+'</b><small>'+esc(t.koleksi)+' · '+esc(t.tier)+'</small><div class="pr">'+fmt(h[0])+' <small>· Tanpa Foto '+fmt(h[1])+'</small></div><button type="button" class="dt" data-id="'+t.id+'">Detail tema &amp; bagian</button><div class="bt"><a href="katalog/'+t.id+'/" target="_blank" rel="noopener">Lihat contoh</a><a class="p" href="./?tema='+t.id+'&acara='+t.acara[0]+'">Pakai tema</a></div></div></div>'}).join('');
}
document.getElementById('kol').onclick=function(e){var b=e.target.closest('button');if(b){k=b.dataset.k;draw()}};
var I={},TR={Standar:0,Premium:1,Signature:2};
document.getElementById('g').addEventListener('click',function(ev){var b=ev.target.closest('.dt');if(!b)return;var t=T.filter(function(x){return x.id===b.dataset.id})[0],L=function(g,k){return (I[g]||{})[k]||k},lv=TR[t.tier]||0,h=HARGA[t.tier];
 var gaya=[L('layout',t.layout),L('ornamen',t.ornamen),L('gerak',t.gerak)];if(t.interaksi&&t.interaksi!=='none')gaya.push(L('interaksi',t.interaksi));if(t.gelap)gaya.push('Latar gelap');
 var sec=(I.section||[]).map(function(s){var ok=(TR[s[1]]||0)<=lv;return '<li class="'+(ok?'':'no')+'"><i>'+(ok?'✓':'–')+'</i>'+esc(s[0])+(ok?'':'<em>paket '+esc(s[1])+'</em>')+'</li>'}).join('');
 var d=document.getElementById('dlg');d.innerHTML='<button class="x" type="button" aria-label="Tutup">×</button><div class="hd"><img src="katalog/'+t.id+'/sampul.jpg" alt=""><div><h3>'+esc(t.nama)+'</h3><small>'+esc(t.koleksi)+' · '+esc(t.tier)+'</small><div>'+fmt(h[0])+' <small>· Tanpa Foto '+fmt(h[1])+'</small></div></div></div><div class="bd"><p>'+esc(t.deskripsi||'')+'</p><h4>Cocok untuk</h4><p>'+t.acara.map(function(a){return esc(L('acara',a))}).join(', ')+'</p><h4>Gaya</h4><p>'+gaya.map(esc).join(' · ')+'</p><h4>Bagian undangan (paket '+esc(t.tier)+')</h4><ul>'+sec+'</ul><p style="font-size:12px;opacity:.8;margin-top:10px">'+esc(I.catatan||'')+'</p></div>';
 d.querySelector('.x').onclick=function(){d.close()};d.showModal()});
document.getElementById('dlg').addEventListener('click',function(ev){if(ev.target===this)this.close()});
Promise.all([fetch('themes/themes.json').then(function(r){return r.json()}),fetch('themes/info.json').then(function(r){return r.json()})]).then(function(j){T=j[0];I=j[1];draw()});
</script></body></html>
