<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Velora Link Tamu</title><meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#6B5560;--rose:#A9706A;--bg:#F7F2EC;--card:#fff;--line:#E4DACB;--txt:#4A3C42}
@media(prefers-color-scheme:dark){:root{--bg:#1E1A1C;--card:#2A2427;--line:#44393F;--txt:#EDE3E6;--ink:#E7D7DC}}
*{box-sizing:border-box}body{margin:0;font-family:Poppins,sans-serif;background:var(--bg);color:var(--txt);font-size:15px}
header{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--card);display:flex;gap:12px;align-items:center}
header b{color:var(--ink)}header a{color:var(--rose);text-decoration:none;font-size:13px;margin-left:auto}
main{max-width:560px;margin:0 auto;padding:20px}
label{display:block;margin:14px 0 5px;font-size:12px;opacity:.8}
input,textarea{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--txt)}
textarea{min-height:130px;resize:vertical}
.lk{margin-top:14px;padding:12px 14px;border-radius:10px;background:rgba(201,162,122,.18);word-break:break-all;font-size:13px;min-height:44px}
.bt{display:grid;gap:10px;margin-top:14px}
button,a.b{font:inherit;font-weight:500;cursor:pointer;border:0;border-radius:999px;padding:13px 18px;background:var(--rose);color:#fff;text-align:center;text-decoration:none;display:block}
button.o{background:transparent;border:1px solid var(--rose);color:var(--rose)}
.hint{font-size:11px;opacity:.65;margin-top:5px}
</style></head><body>
<header><b>Link Tamu</b><a href="./">← Generator undangan</a></header>
<main>
<details style="margin-bottom:6px"><summary style="cursor:pointer;font-size:12px;opacity:.75">Alamat undangan: <span id="bshow"></span> (ubah)</summary>
<input id="base" inputmode="url" autocomplete="off" style="margin-top:8px"></details>
<label for="nama">Kirim ke siapa?</label>
<input id="nama" placeholder="Contoh: Ais &amp; Keluarga" autocomplete="off">
<label for="msg">Isi pesan</label>
<textarea id="msg">Assalamu'alaikum Wr. Wb.

Kepada Yth. {nama}

Dengan memohon rahmat dan ridho Allah SWT, kami mengundang Anda ke acara kami. Detail undangan ada di tautan berikut:
{link}

Terima kasih atas doa dan kehadirannya.</textarea>
<div class="hint"><b>{nama}</b> diganti nama tamu, <b>{link}</b> diganti link undangan. Jika <b>{link}</b> dihapus dari pesan, link tetap ditempel di akhir.</div>
<label>Link untuk tamu ini</label>
<div class="lk" id="lk">Isi alamat undangan dan nama tamu.</div>
<div class="bt">
<a class="b" id="wa" target="_blank" rel="noopener">Kirim lewat WhatsApp</a>
<button type="button" id="cp">Salin pesan + link</button>
<button type="button" class="o" id="cl">Salin link saja</button>
</div>
<div class="hint" id="st" style="text-align:center"></div>
</main>
<script>
'use strict';
var DEFAULT_BASE='https://isvarya27.github.io/alunacya-invitation/';
var $=function(i){return document.getElementById(i)};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v)}catch(e){return ''}}
function enc(n){return encodeURIComponent(n).replace(/%20/g,'+')}
function norm(b){b=b.trim();if(!b)return '';if(!/^https?:\/\//i.test(b))b='https://'+b;b=b.split('?')[0].split('#')[0];return b.replace(/\/?$/,'/')}
function get(){
  var base=norm($('base').value),nama=$('nama').value.trim(),link=(base&&nama)?base+'?to='+enc(nama):'';
  var m=$('msg').value,teks=m.split('{nama}').join(nama||'Bapak/Ibu');
  if(link){teks=m.indexOf('{link}')>-1?teks.split('{link}').join(link):teks.replace(/\s+$/,'')+'\n\n'+link}
  else teks=teks.split('{link}').join('');
  return{link:link,teks:teks};
}
function draw(){
  var g=get();ls('vl_base',$('base').value);$('bshow').textContent=$('base').value.replace(/^https?:\/\//,'');ls('vl_msg',$('msg').value);
  $('lk').textContent=g.link||'Isi nama tamu.';
  $('wa').href=g.link?'https://wa.me/?text='+encodeURIComponent(g.teks):'#';
  $('wa').style.opacity=g.link?1:.5;
}
function copy(t,label){
  if(!t){$('st').textContent='Isi nama tamu dulu.';return}
  var ok=function(){$('st').textContent=label+' tersalin ✓';setTimeout(function(){$('st').textContent=''},1800)};
  var fb=function(){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity=0;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){$('st').textContent='Gagal menyalin, salin manual dari kotak link.'}a.remove()};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(ok,fb);else fb();
}
$('wa').addEventListener('click',function(e){if(!get().link){e.preventDefault();$('st').textContent='Isi nama tamu dulu.'}});
$('cp').onclick=function(){copy(get().teks,'Pesan + link')};
$('cl').onclick=function(){copy(get().link,'Link')};
['base','nama','msg'].forEach(function(i){$(i).addEventListener('input',draw)});
$('base').value=ls('vl_base')||DEFAULT_BASE;if(ls('vl_msg'))$('msg').value=ls('vl_msg');draw();
</script></body></html>
