<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Velora Link Tamu</title><meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#6B5560;--rose:#A9706A;--bg:#F7F2EC;--card:#fff;--line:#E4DACB;--txt:#4A3C42}
@media(prefers-color-scheme:dark){:root{--bg:#1E1A1C;--card:#2A2427;--line:#44393F;--txt:#EDE3E6;--ink:#E7D7DC}}
*{box-sizing:border-box}body{margin:0;font-family:Poppins,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--card);display:flex;gap:12px;align-items:center}
header a{color:var(--rose);text-decoration:none;font-size:13px;margin-left:auto}header b{color:var(--ink)}
main{max-width:760px;margin:0 auto;padding:20px}
label{display:block;margin:12px 0 4px;font-size:12px;opacity:.8}
input,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--txt)}
textarea{min-height:120px;resize:vertical}.hint{font-size:11px;opacity:.65;margin-top:4px}
button,.b{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:8px 16px;background:var(--rose);color:#fff;font-size:12px;text-decoration:none;display:inline-block}
button.o,.b.o{background:transparent;border:1px solid var(--rose);color:var(--rose)}
.it{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.it b{color:var(--ink)}.it code{display:block;font-size:11px;word-break:break-all;opacity:.75;margin:4px 0 8px}
.top{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
</style></head><body>
<header><b>Generator Link Tamu</b><a href="./">← Generator undangan</a></header>
<main>
<label>Alamat undangan (tanpa ?to=)</label><input id="base" placeholder="https://isvarya27.github.io/alunacya-invitation/">
<label>Nama tamu (satu per baris). Boleh tambah nomor WhatsApp: <code>Ais &amp; Keluarga | 08123456789</code></label>
<textarea id="names" placeholder="Ais &amp; Keluarga&#10;Bapak Budi | 081234567890&#10;Keluarga Besar Rizal"></textarea>
<label>Pesan WhatsApp (<code>{nama}</code> dan <code>{link}</code> diganti otomatis)</label>
<textarea id="msg">Assalamu'alaikum Wr. Wb.

Kepada Yth. {nama}

Dengan memohon rahmat dan ridho Allah SWT, kami mengundang Anda ke acara kami. Detail undangan ada di tautan berikut:
{link}

Terima kasih atas doa dan kehadirannya.</textarea>
<div class="top"><button id="all" type="button">Salin semua link</button><button id="csv" type="button" class="o">Unduh CSV</button><span class="hint" id="st" style="align-self:center"></span></div>
<div id="out"></div>
</main>
<script>
'use strict';
var $=function(i){return document.getElementById(i)};
function enc(n){return encodeURIComponent(n).replace(/%20/g,'+')}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v)}catch(e){return ''}}
function parse(){
  var base=$('base').value.trim(),msg=$('msg').value;
  if(base&&!/[?]/.test(base)&&!/\/$/.test(base))base+='/';
  return $('names').value.split('\n').map(function(l){return l.trim()}).filter(Boolean).map(function(l){
    var p=l.split('|'),nama=p[0].trim(),hp=(p[1]||'').replace(/\D/g,'');
    if(hp.charAt(0)==='0')hp='62'+hp.slice(1);
    var link=base?base+'?to='+enc(nama):'';
    var teks=msg.split('{nama}').join(nama).split('{link}').join(link);
    return{nama:nama,hp:hp,link:link,wa:'https://wa.me/'+hp+'?text='+encodeURIComponent(teks),teks:teks};
  });
}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function copy(t,btn){navigator.clipboard.writeText(t).then(function(){var o=btn.textContent;btn.textContent='Tersalin ✓';setTimeout(function(){btn.textContent=o},1200)})}
var rows=[];
function draw(){
  rows=parse();ls('vl_base',$('base').value);ls('vl_msg',$('msg').value);
  $('out').innerHTML=rows.map(function(r,i){return '<div class="it"><b>'+esc(r.nama)+'</b><code>'+esc(r.link||'(isi alamat undangan dulu)')+'</code>'+
   '<button type="button" data-c="'+i+'">Salin link</button> <button type="button" class="o" data-t="'+i+'">Salin pesan</button> <a class="b o" target="_blank" rel="noopener" href="'+esc(r.wa)+'">Kirim WA</a></div>'}).join('');
  $('st').textContent=rows.length?rows.length+' link':'';
}
$('out').addEventListener('click',function(e){var b=e.target;if(b.dataset.c!==undefined)copy(rows[b.dataset.c].link,b);if(b.dataset.t!==undefined)copy(rows[b.dataset.t].teks,b)});
$('all').onclick=function(){copy(rows.map(function(r){return r.nama+'\t'+r.link}).join('\n'),$('all'))};
$('csv').onclick=function(){var c='nama,link\n'+rows.map(function(r){return '"'+r.nama.replace(/"/g,'""')+'","'+r.link+'"'}).join('\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='link-tamu.csv';a.click()};
['base','names','msg'].forEach(function(i){$(i).addEventListener('input',draw)});
$('base').value=ls('vl_base');if(ls('vl_msg'))$('msg').value=ls('vl_msg');draw();
</script></body></html>
